  }
  header {
    border-bottom: 1px dotted #999;

  }
  .top-cap {
      background-image: url(data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDBweCIgdmlld0JveD0iMCAwIDEyODAgMTQwIiBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxnIGZpbGw9IiNmZmZmZmYiPjxwYXRoIGQ9Ik0xMjgwIDE0MFYwSDBsMTI4MCAxNDB6Ii8+PC9nPjwvc3ZnPg==);
      background-size: 100% 30px;
      top: 0;
      height: 30px;
      z-index: 1;
      transform: scale(1, 1);
  }
  .cap-50 {
      background-size: 100% 50px;
      height: 50px;
  }
  .bottom-cap {
      background-image: url(data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDBweCIgdmlld0JveD0iMCAwIDEyODAgMTQwIiBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxnIGZpbGw9IiNmZmZmZmYiPjxwYXRoIGQ9Ik0wIDB2MTQwaDEyODBMMCAweiIgZmlsbC1vcGFjaXR5PSIuNSIvPjxwYXRoIGQ9Ik0wIDQydjk4aDEyODBMMCA0MnoiLz48L2c+PC9zdmc+);
      background-size: 100% 60px;
      bottom: 0;
      height: 60px;
      z-index: 1;
      transform: scale(1,1);
  }
  .reverse-cap {
      transform: scale(-1,1);
  }

  #hero + .bottom-cap {
    height: 6px;
    background-size: 2.083333333% 6px;
    position: relative;
    top: -2px;
  }

  span.mark {
    position:relative;
    padding: 5px 3px 0px 5px;
    margin-right: 1px;
  }

  span.mark:before {
    content:"";
    z-index: 1;
    left: 0em;
    top: 0em;
    border-width: 2px;
    border-style: solid;
    border-color: green;
    position: absolute;
    border-right-color: transparent;
    width: 100%;
    height: 2em;
    transform: rotate(1.2deg);
    opacity: 0.5;
    border-radius: 50%;
    padding: 0.1em 0.25em;
  }

  span.mark:after {
    content: "";
    z-index: 4;
    left: 0.25em;
    top: 0.1em;
    padding: 0.1em 0.25em;
    border-width: 2px;
    border-style: solid;
    border-color: green;
    border-left-color: transparent;
    border-top-color: transparent;
    position: absolute;
    width: 100%;
    height: 2em;
    transform: rotate(-0.75deg);
    opacity: 0.5;
    border-radius: 50%;
  }
</style>
