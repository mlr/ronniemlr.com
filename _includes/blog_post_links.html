<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
  {% for post in site.posts %}
  <a href="{{ post.url }}" class="group block h-full">
    <div class="h-full flex flex-col border border-slate-200 dark:border-slate-700 rounded-lg overflow-hidden hover:border-slate-300 dark:hover:border-slate-600 transition-all hover:shadow-md">
      <div class="post-thumbnail aspect-[16/9] bg-gradient-to-br from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700">
        {% if post.image %}
          <img src="{{ post.image }}" alt="{{ post.title }}" class="object-cover h-full w-full" />
        {% endif %}
      </div>

      <div class="p-5 flex flex-col flex-grow">
        <h3 class="blog-post-title text-lg font-bold mb-4 text-sky-700 dark:text-sky-400 group-hover:text-sky-800 dark:group-hover:text-sky-300 transition-colors leading-tight line-clamp-2">
          {{ post.title }}
        </h3>

        <div class="blog-post-meta flex flex-wrap gap-2 text-slate-500 dark:text-slate-400 text-sm mt-auto">
          <span class="font-medium">{{ post.date | date: "%b %-d, %Y" }}</span>
          {% if post.tags and post.tags != empty %}
            <span class="px-1">•</span>
            <span>
              {% for tag in post.tags %}
                <a href="/tags/#{{ tag | slugify }}" class="hover:text-sky-700 dark:hover:text-sky-400 hover:underline">{{ tag | replace: '_', ' ' }}</a>{% unless forloop.last %}, {% endunless %}
              {% endfor %}
            </span>
          {% endif %}
        </div>
      </div>
    </div>
  </a>
  {% endfor %}
</div>
