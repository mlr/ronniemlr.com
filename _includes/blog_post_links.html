<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
  {% for post in site.posts %}
  <article class="group h-full border border-slate-200 dark:border-slate-700 rounded-lg overflow-hidden hover:border-slate-300 dark:hover:border-slate-600 transition-all hover:shadow-md relative">
    <div class="relative h-full flex flex-col">
      <!-- Thumbnail -->
      <div class="post-thumbnail aspect-[16/9] bg-gradient-to-br from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-700">
        {% if post.image %}
          <img src="{{ post.image }}" alt="{{ post.title }}" class="object-cover h-full w-full" />
        {% endif %}
      </div>

      <!-- Content -->
      <div class="p-5 flex flex-col flex-grow">
        <!-- Title -->
        <h3 class="blog-post-title text-lg font-bold mb-2 text-sky-700 dark:text-sky-400 group-hover:text-sky-800 dark:group-hover:text-sky-300 transition-colors leading-tight line-clamp-2">
          {{ post.title }}
        </h3>
        
        <!-- Date -->
        <div class="mb-3 text-sm text-slate-500 dark:text-slate-400">
          {{ post.date | date: "%b %-d, %Y" }}
        </div>
        
        <!-- Tags -->
        {% if post.tags and post.tags != empty %}
        <div class="tag-container mt-auto flex flex-wrap gap-1 relative z-10">
          {% for tag in post.tags %}
            <a href="/tags/#{{ tag | slugify }}" class="text-xs py-0.5 px-2 bg-slate-100 hover:bg-sky-100 dark:bg-slate-700 dark:hover:bg-sky-900 rounded-full text-slate-700 dark:text-slate-300 hover:text-sky-700 dark:hover:text-sky-400 transition-colors">{{ tag | replace: '_', ' ' }}</a>
          {% endfor %}
        </div>
        {% endif %}

        <!-- Overlay link - Covers entire card except tags -->
        <a href="{{ post.url }}" class="absolute inset-0 z-0" aria-label="Read more about {{ post.title }}"></a>
      </div>
    </div>
  </article>
  {% endfor %}
</div>
