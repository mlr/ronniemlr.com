<div id="theme-switcher" class="relative ml-3">
  <button 
    id="theme-toggle-cycle" 
    aria-label="Toggle color theme"
    class="theme-toggle-btn p-2 rounded-full transition-all duration-300 bg-gray-100 dark:bg-slate-700 hover:bg-white hover:shadow-md dark:hover:bg-slate-600 border border-gray-200 dark:border-slate-600 relative"
    title="Cycle color theme">
    <!-- System theme icon -->
    <svg xmlns="http://www.w3.org/2000/svg" class="theme-icon system h-5 w-5 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
    </svg>
    
    <!-- Dark theme icon -->
    <svg xmlns="http://www.w3.org/2000/svg" class="theme-icon dark h-5 w-5 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
    </svg>
    
    <!-- Light theme icon -->
    <svg xmlns="http://www.w3.org/2000/svg" class="theme-icon light h-5 w-5 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
    </svg>
    
    <span class="sr-only">Toggle Theme</span>
  </button>
  
  <!-- Debug helper -->
  <span id="theme-debug" class="hidden absolute -bottom-6 right-0 text-xs text-slate-500"></span>
</div>

<style>
  .theme-toggle-btn {
    position: relative;
    z-index: 1;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .theme-toggle-btn svg {
    position: absolute;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    transform: scale(0.9);
  }
  
  .theme-toggle-btn .theme-icon.active {
    opacity: 1;
    transform: scale(1);
  }
  
  .theme-toggle-btn:hover {
    transform: translateY(-1px);
  }
  
  .theme-toggle-btn .theme-icon.active {
    color: #0369a1 !important; /* sky-700 */
  }
  
  .dark .theme-toggle-btn .theme-icon.active {
    color: #38bdf8 !important; /* sky-400 */
  }
  
  /* No dot indicator - using the visible icon instead */
  
  /* Animation for theme cycling */
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  
  .theme-toggle-btn.cycling {
    animation: pulse 0.3s ease;
  }
  
  .theme-toggle-btn.theme-changed {
    box-shadow: 0 0 0 2px rgba(3, 105, 161, 0.3);
  }
  
  .dark .theme-toggle-btn.theme-changed {
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3);
  }
</style>
