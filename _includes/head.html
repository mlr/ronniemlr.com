<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
<meta http-equiv="content-language" content="en-us" />
<meta name="robots" content="index, follow" />
<meta name="description" content="{% if page.description %}{{ page.description | strip_newlines }} - {% endif %}{{ site.description }}" />
<meta name="keywords" content="{% if page.keywords %}{{ page.keywords | strip_newlines }}, {% endif %}{{ site.keywords }}" />
<meta property="og:title" content="{% if page.title %}{{ page.title }} - {% endif %}Ronnie Miller - Software Developer">
<meta property="og:description" content="{% if page.description %}{{ page.description | strip_newlines }} - {% endif %}{{ site.description }}">
<meta property="og:image" content={{ site.baseurl }}{% if page.image %}{{ page.image }}{% else %}/images/me.jpg{% endif %}">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} - {% endif %}Ronnie Miller - Software Developer</title>
<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/css/screen.css" />
<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/css/print.css" media="print" />
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
