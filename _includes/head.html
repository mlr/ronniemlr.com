  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <script>
    // Apply a saved theme before the page paints. No saved choice means "follow the system".
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    })();
  </script>
  <title>{% if page.title %}{{ page.title }} - {% endif %}Ronnie Miller - Software Developer</title>
  <meta name="robots" content="index, follow" />
  <meta name="description" content="{% if page.description %}{{ page.description | strip_newlines }} - {% endif %}{{ site.description }}" />
  <meta name="keywords" content="{% if page.keywords %}{{ page.keywords | strip_newlines }}, {% endif %}{{ site.keywords }}" />
  <meta property="og:title" content="{% if page.title %}{{ page.title }} - {% endif %}Ronnie Miller - Software Developer" />
  <meta property="og:description" content="{% if page.description %}{{ page.description | strip_newlines }} - {% endif %}{{ site.description }}" />
  <meta property="og:image" content="{{ site.url }}{% if page.image %}{{ page.image }}{% else %}/images/me.jpg{% endif %}" />
  <link rel="icon" href="{{ site.baseurl }}/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/css/screen.css" />
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/css/print.css" media="print" />
  {% feed_meta %}
