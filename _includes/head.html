<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
<meta http-equiv="content-language" content="en-us" />
<meta name="robots" content="index, follow" />
<meta name="description" content="{% if page.description %}{{ page.description | strip_newlines }} - {% endif %}{{ site.description }}" />
<meta name="keywords" content="{% if page.keywords %}{{ page.keywords | strip_newlines }}, {% endif %}{{ site.keywords }}" />
<meta property="og:title" content="{% if page.title %}{{ page.title }} - {% endif %}Ronnie Miller - Software Developer">
<meta property="og:description" content="{% if page.description %}{{ page.description | strip_newlines }} - {% endif %}{{ site.description }}">
<meta property="og:image" content={{ site.baseurl }}{% if page.image %}{{ page.image }}{% else %}/images/me.jpg{% endif %}">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} - {% endif %}Ronnie Miller - Software Developer</title>
<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/css/screen.css" />
<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/css/print.css" media="print" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Configure Tailwind darkMode with the CDN
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        typography: {
          DEFAULT: {
            css: {
              maxWidth: '80ch',
            }
          }
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
<!-- <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/css/print.css" media="print" /> -->
<!-- Initialize dark mode -->
<script>
  // On page load, set initial theme to prevent flash of unstyled content (FOUC)
  (function() {
    const theme = localStorage.getItem('theme');
    
    // If user has explicitly set a theme, use that
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
    } else if (theme === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      // No explicit preference, use system preference
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
  })();
</script>
